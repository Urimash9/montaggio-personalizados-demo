name: Montaggio Final Assets

on:
  push:
    branches:
      - assets/montaggio-curadoria-v1
    paths:
      - .github/workflows/montaggio-final-assets.yml

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: assets/montaggio-curadoria-v1

      - name: Download final curated assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/reais/destaque
          mkdir -p assets/images/reais/projetos
          mkdir -p assets/images/editorial/sobre
          mkdir -p assets/images/editorial/materialidade
          mkdir -p assets/images/editorial/contato

          curl -fL 'https://gcdn.picsart.com/editing-temp/ef18bc39-c78e-4a9f-a64f-275f4b376eba.webp' -o assets/images/reais/destaque/projeto-destaque.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/89d7eb0d-4dd1-490b-9b1a-15df96b29c59.webp' -o assets/images/reais/projetos/projeto-01.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/d5787cc0-759f-414b-a0fe-bf8fd6bcc1a3.webp' -o assets/images/reais/projetos/projeto-02.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/35330919-0823-401f-aa35-311f85fdbc8a.webp' -o assets/images/reais/projetos/projeto-03.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/71a9c258-0c5a-46a5-808a-0c74574c8db4.webp' -o assets/images/reais/projetos/projeto-04.webp

          curl -fL 'https://gcdn.picsart.com/editing-temp/1d515507-bd98-4dfa-aa80-3be4efedc2f7.webp' -o assets/images/editorial/sobre/sobre-principal.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/bf2b75a4-fdb6-4d94-846d-9901eaffc2c1.webp' -o assets/images/editorial/sobre/sobre-secundaria.webp

          curl -fL 'https://gcdn.picsart.com/editing-temp/5884c224-5401-48b8-b7a2-ec51e609d235.webp' -o assets/images/editorial/materialidade/vidro-transparencia.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/2f3f77cb-e97e-47ce-85dc-c8c5f1909270.webp' -o assets/images/editorial/materialidade/madeira-textura.webp
          curl -fL 'https://gcdn.picsart.com/editing-temp/6583356c-39bc-4461-90fa-4ecb456539ce.webp' -o assets/images/editorial/materialidade/luz-integrada.webp

          curl -fL 'https://gcdn.picsart.com/editing-temp/b5d01e10-d34a-4740-870e-228674e91363.webp' -o assets/images/editorial/contato/cta-adega.webp

          test $(stat -c%s assets/images/reais/destaque/projeto-destaque.webp) -gt 40000
          test $(stat -c%s assets/images/reais/projetos/projeto-03.webp) -gt 100000
          test $(stat -c%s assets/images/editorial/contato/cta-adega.webp) -gt 70000

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/reais assets/images/editorial
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
          else
            git commit -m 'Add final Montaggio image assets'
            git push origin HEAD:assets/montaggio-curadoria-v1
          fi
