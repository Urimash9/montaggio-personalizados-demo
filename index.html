<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interiores Sob Medida — Estudo Conceitual / AVERO STUDIO</title>
<meta name="description" content="Estudo conceitual de interiores sob medida desenvolvido pela AVERO STUDIO.">
<meta name="robots" content="noindex, nofollow">
<style>
html,body{margin:0;min-height:100%;background:#171918;color:#fff;font-family:Arial,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
</style>
</head>
<body>
<div id="loading">Carregando estudo conceitual…</div>
<script>
(async()=>{
  const curated={
    hero:'/assets/images/hero/cozinha-hero.webp',
    environments:[
      '/assets/images/ambientes/cozinha-alt.webp',
      '/assets/images/ambientes/closet-frontal.webp',
      '/assets/images/ambientes/dormitorio-painel.webp',
      '/assets/images/ambientes/home-office-executivo.webp',
      '/assets/images/ambientes/sala-painel-tv.webp'
    ],
    references:[
      {src:'/assets/images/referencias/painel-madeira-corredor.webp',title:'Painel amadeirado',sub:'Circulação · painel e iluminação',alt:'Referência editorial de painel amadeirado',w:1122,h:1402},
      {src:'/assets/images/referencias/cristaleira.webp',title:'Cristaleira iluminada',sub:'Exposição · vidro e iluminação',alt:'Referência editorial de cristaleira iluminada',w:1122,h:1402},
      {src:'/assets/images/referencias/closet-canelado.webp',title:'Closet planejado',sub:'Closet · composição canelada',alt:'Referência editorial de closet canelado',w:1122,h:1402},
      {src:'/assets/images/referencias/adega.webp',title:'Adega planejada',sub:'Adega · armazenamento e presença',alt:'Referência editorial de adega planejada',w:1122,h:1402},
      {src:'/assets/images/referencias/escritorio-conceitual.webp',title:'Home office',sub:'Trabalho · organização minimalista',alt:'Estudo conceitual de home office em madeira clara',w:1122,h:1402},
      {src:'/assets/images/referencias/sala-jantar.webp',title:'Sala de jantar',sub:'Convívio · integração e matéria',alt:'Referência editorial de sala de jantar',w:1448,h:1086},
      {src:'/assets/images/referencias/detalhe-marcenaria.webp',title:'Detalhe de marcenaria',sub:'Precisão · matéria e acabamento',alt:'Referência editorial de detalhe de marcenaria',w:1122,h:1402}
    ]
  };

  const finalAssets={
    about:[
      {src:'/assets/images/editorial/sobre/sobre-principal.webp',alt:'Composição editorial de marcenaria e iluminação',w:840,h:1200},
      {src:'/assets/images/editorial/sobre/sobre-secundaria.webp',alt:'Composição editorial de home office planejado',w:840,h:1200}
    ],
    featured:{src:'/assets/images/conceito/cozinha-integrada.webp',alt:'Estudo conceitual de cozinha integrada',w:987,h:1200},
    material:[
      {src:'/assets/images/editorial/materialidade/vidro-transparencia.webp',alt:'Detalhe editorial de vidro e transparência',w:840,h:1200},
      {src:'/assets/images/editorial/materialidade/madeira-textura.webp',alt:'Detalhe editorial de madeira e textura',w:1200,h:840},
      {src:'/assets/images/editorial/materialidade/luz-integrada.webp',alt:'Detalhe editorial de iluminação integrada',w:840,h:1200}
    ],
    projects:[
      {src:'/assets/images/conceito/closet.webp',alt:'Estudo conceitual de closet em madeira e vidro',title:'Closet',category:'Estudo conceitual',w:1200,h:964},
      {src:'/assets/images/conceito/escritorio.webp',alt:'Estudo conceitual de home office em carvalho',title:'Home Office',category:'Estudo conceitual',w:987,h:1200},
      {src:'/assets/images/conceito/cristaleira.webp',alt:'Estudo conceitual de cristaleira com vidro fumê',title:'Cristaleira',category:'Estudo conceitual',w:987,h:1200},
      {src:'/assets/images/conceito/painel.webp',alt:'Estudo conceitual de painel integrado para sala',title:'Painel integrado',category:'Estudo conceitual',w:1200,h:902}
    ],
    cta:{src:'/assets/images/editorial/contato/cta-adega.webp',alt:'Referência editorial de adega planejada com iluminação',w:1200,h:675}
  };

  const setImage=(img,data,{lazy=true}={})=>{
    if(!img||!data)return;
    img.src=data.src;
    img.alt=data.alt||'';
    img.width=data.w;
    img.height=data.h;
    img.decoding='async';
    if(lazy)img.loading='lazy'; else img.removeAttribute('loading');
  };

  const applyCuratedAssets=(doc)=>{
    const preload=doc.createElement('link');
    preload.rel='preload'; preload.as='image'; preload.href=curated.hero; preload.type='image/webp'; preload.setAttribute('fetchpriority','high');
    doc.head.appendChild(preload);

    const hero=doc.querySelector('.hero-image img');
    if(hero){hero.src=curated.hero;hero.alt='';hero.width=1672;hero.height=941;hero.decoding='async';hero.setAttribute('fetchpriority','high');hero.removeAttribute('loading');}

    const environmentButtons=[...doc.querySelectorAll('.environment-item')];
    environmentButtons.slice(0,curated.environments.length).forEach((btn,i)=>btn.dataset.img=curated.environments[i]);
    const environmentPreview=doc.getElementById('environmentPreview');
    if(environmentPreview){environmentPreview.src=curated.environments[0];environmentPreview.width=1448;environmentPreview.height=1086;environmentPreview.decoding='async';environmentPreview.loading='lazy';}

    const spatialCopy=doc.querySelector('.spatial-head > p');
    if(spatialCopy) spatialCopy.textContent='Explore referências conceituais de materiais, luz e composição. As imagens são estudos visuais para inspirar possibilidades de ambiente.';

    const cards=[...doc.querySelectorAll('.spatial-card')];
    cards.slice(0,curated.references.length).forEach((card,i)=>{
      const data=curated.references[i];
      card.dataset.title=data.title;
      card.dataset.sub=data.sub;
      card.dataset.index=String(i);
      setImage(card.querySelector('img'),data);
      const number=card.querySelector('.card-surface span');
      if(number) number.textContent=String(i+1).padStart(2,'0');
      const title=card.querySelector('.card-surface strong');
      if(title) title.textContent=data.title;
    });

    const activeTitle=doc.getElementById('activeTitle');
    const activeSub=doc.getElementById('activeSub');
    const activeBudget=doc.getElementById('activeBudget');
    if(activeTitle) activeTitle.textContent=curated.references[0].title;
    if(activeSub) activeSub.textContent=curated.references[0].sub;
    if(activeBudget) activeBudget.href='#projetos';

    setImage(doc.querySelector('.intro-shape-main img'),finalAssets.about[0]);
    setImage(doc.querySelector('.intro-shape-small img'),finalAssets.about[1]);
    setImage(doc.querySelector('.featured-visual img'),finalAssets.featured);

    [doc.querySelector('.detail-tall img'),doc.querySelector('.detail-wide img'),doc.querySelector('.detail-small img')]
      .forEach((img,i)=>setImage(img,finalAssets.material[i]));

    ['.project.p1','.project.p2','.project.p3','.project.p4'].forEach((selector,i)=>{
      const figure=doc.querySelector(selector);
      const data=finalAssets.projects[i];
      if(!figure||!data)return;
      setImage(figure.querySelector('img'),data);
      const title=figure.querySelector('figcaption strong');
      const category=figure.querySelector('figcaption span');
      if(title)title.textContent=data.title;
      if(category)category.textContent=data.category;
    });

    setImage(doc.querySelector('.final-cta > img'),finalAssets.cta);

    /* Lapidação final solicitada: retirar numerações decorativas sem alterar a composição. */
    const heroIndex=doc.querySelector('.hero-index b');
    if(heroIndex) heroIndex.remove();

    const featuredLabel=doc.querySelector('.featured-label b');
    if(featuredLabel) featuredLabel.textContent='CONCEITO';

    doc.querySelectorAll('.detail-composition figcaption').forEach(caption=>caption.remove());

    const finalPolish=doc.createElement('style');
    finalPolish.id='concept-final-polish';
    finalPolish.textContent=`
      .hero-index{gap:14px}
      .hero-index span{margin-left:0}
      .detail-composition figcaption{display:none!important}
      .testimonial .testimonial-layout{display:block!important}
      .testimonial-heading{max-width:700px}
      .reviews-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:52px;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14)}
      .review-card{min-height:250px;padding:32px 34px 34px 0;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.12)}
      .review-card:not(:first-child){padding-left:34px}
      .review-card:last-child{border-right:0}
      .review-kicker{font-size:13px;letter-spacing:.22em;color:rgba(255,255,255,.66);margin-bottom:28px}
      .testimonial .review-card .concept-statement{margin:0;max-width:none;font-size:clamp(20px,1.45vw,27px);line-height:1.34;font-weight:390;letter-spacing:-.025em;color:#f1eee8}
      .testimonial .review-card footer{margin-top:auto;padding-top:34px;display:flex;flex-direction:column;gap:7px}
      .testimonial .review-card footer strong{font-size:12px;line-height:1.45;font-weight:650;letter-spacing:.01em;color:#f3f0ea}
      .testimonial .review-card footer span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.38)}
      @media(max-width:560px){
        .reviews-grid{grid-template-columns:1fr;margin-top:34px}
        .review-card,.review-card:not(:first-child){min-height:0;padding:28px 0;border-right:0;border-bottom:1px solid rgba(255,255,255,.12)}
        .review-card:last-child{border-bottom:0}
        .review-kicker{margin-bottom:18px}
        .testimonial .review-card .concept-statement{font-size:22px;line-height:1.32}
        .testimonial .review-card footer{margin-top:26px;padding-top:0}
      }
    `;
    doc.head.appendChild(finalPolish);
  };

  try{
    const files=['concept.html'];
    const [parts,refinement]=await Promise.all([
      Promise.all(files.map(f=>fetch('/approved/'+f).then(r=>{if(!r.ok)throw new Error(f);return r.text()}))),
      fetch('/approved/v23.css').then(r=>{if(!r.ok)throw new Error('v23.css');return r.text()})
    ]);

    const source=parts.join('');
    const doc=new DOMParser().parseFromString(source,'text/html');
    const style=doc.createElement('style');
    style.id='v23-refinement';
    style.textContent=refinement;
    doc.head.appendChild(style);
    applyCuratedAssets(doc);

    document.open();
    document.write('<!doctype html>'+doc.documentElement.outerHTML);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar a base aprovada.';
    console.error(e);
  }
})();
</script>
</body>
</html>
