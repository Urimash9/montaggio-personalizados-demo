<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montaggio Ambientes Planejados — Base Aprovada</title>
<style>
html,body{margin:0;min-height:100%;background:#171918;color:#fff;font-family:Arial,sans-serif}
#loading{min-height:100vh;display:grid;place-items:center;font-size:14px;letter-spacing:.12em;text-transform:uppercase;opacity:.65}
</style>
</head>
<body>
<div id="loading">Carregando Montaggio…</div>
<script>
(async()=>{
  try{
    const files=['chunk-01.txt','chunk-02.txt','chunk-03.txt','chunk-04.txt','chunk-05.txt','chunk-06.txt','chunk-07.txt'];
    const parts=await Promise.all(files.map(f=>fetch('/approved/'+f).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('loading').textContent='Falha ao carregar a base aprovada.';
    console.error(e);
  }
})();
</script>
</body>
</html>
